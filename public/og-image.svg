<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#070A12"/>
  <circle cx="200" cy="150" r="300" fill="#00F0FF" fill-opacity="0.04"/>
  <circle cx="1000" cy="480" r="280" fill="#F59E0B" fill-opacity="0.04"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#16233A" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#16233A" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Logo Pill Badge -->
  <rect x="80" y="80" width="220" height="42" rx="21" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="105" y="107" fill="#00F0FF" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">DOJO VALIDASI WEB</text>

  <!-- Title -->
  <text x="80" y="210" fill="#00F0FF" font-family="ui-monospace, monospace" font-size="76" font-weight="900">RegEx <tspan fill="#FFFFFF">Sifu</tspan></text>
  <text x="80" y="270" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="24" font-weight="500">Bengkel Interaktif Pengesahan Borang Web (DFP50283)</text>

  <!-- Pattern Preview Box -->
  <rect x="80" y="340" width="1040" height="120" rx="16" fill="#0A1224" stroke="#1E3256" stroke-width="2"/>
  <text x="120" y="390" fill="#64748B" font-family="ui-monospace, monospace" font-size="14" font-weight="600" letter-spacing="1.5">CONTOH CORAK MALAYSIA (TELEFON BIMBIT):</text>
  <text x="120" y="432" fill="#00F0FF" font-family="ui-monospace, monospace" font-size="28" font-weight="700">
    <tspan fill="#F43F5E">^</tspan><tspan fill="#A78BFA">(?:\+?60|0)</tspan><tspan fill="#10B981">1</tspan><tspan fill="#38BDF8">[0-9]</tspan><tspan fill="#F59E0B">-?\d{7,8}</tspan><tspan fill="#F43F5E">$</tspan>
  </text>

  <!-- Feature Tags -->
  <g transform="translate(80, 520)">
    <rect x="0" y="0" width="230" height="40" rx="8" fill="#132038" stroke="#253A60" stroke-width="1"/>
    <text x="20" y="25" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">✓ Token Visualizer</text>

    <rect x="250" y="0" width="240" height="40" rx="8" fill="#132038" stroke="#253A60" stroke-width="1"/>
    <text x="270" y="25" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">✓ 33+ Contoh Malaysia</text>

    <rect x="510" y="0" width="220" height="40" rx="8" fill="#132038" stroke="#253A60" stroke-width="1"/>
    <text x="530" y="25" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">✓ Pembantu Sifu Coach</text>

    <rect x="750" y="0" width="230" height="40" rx="8" fill="#132038" stroke="#253A60" stroke-width="1"/>
    <text x="770" y="25" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">✓ HTML & JS Ready</text>
